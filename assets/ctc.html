<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CollTakesChagrin wordmark</title>
<link rel="stylesheet" href="/assets/brand.css">
<style>
body{margin:0;background:var(--bg-0);color:var(--brand-ink);font-family:Inter,system-ui,sans-serif}
section{padding:40px 48px;border-bottom:1px solid var(--line)}
h2{font:700 11px/1 Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 24px}
.light{background:#F2EDE4;color:#141210}
.row{display:flex;align-items:center;gap:40px;flex-wrap:wrap}
svg{display:block}
.ctc{font-family:'Bodoni Moda','Playfair Display',Georgia,serif}
.alt{font-size:72px;letter-spacing:.02em;line-height:1}
.alt i{font-weight:400}
.alt .dot{color:var(--brand-gold)}
.cap{font-family:'Bodoni Moda',Georgia,serif;font-variant:small-caps;letter-spacing:.28em;font-size:40px}
.stack{text-align:center;line-height:.95}
.stack .big{font-size:96px;letter-spacing:.01em}
.stack .small{font-size:22px;letter-spacing:.42em;text-transform:uppercase;color:var(--brand-gold);margin-top:10px}
.note{color:var(--muted);font-size:12px;margin-top:10px}
</style></head><body>
<section><h2>A — current wordmark, as used in the camlab header</h2>
<div class="row"><div style="width:720px"><svg viewBox="0 0 520 76" width="720"><style>.c{font-family:'Bodoni Moda','Playfair Display',Georgia,serif;font-size:46px;letter-spacing:3px}.i{font-style:italic;font-weight:400;letter-spacing:1px}</style><text class="c" x="260" y="50" text-anchor="middle" fill="currentColor" font-weight="500"><tspan>Coll</tspan><tspan class="i" dx="6">Takes</tspan><tspan dx="6">Chagrin</tspan><tspan fill="#C9A86A">.</tspan></text><rect x="190" y="64" width="140" height="1" fill="#C9A86A"/></svg></div>
<div style="width:240px"><svg viewBox="0 0 520 76" width="240"><style>.c2{font-family:'Bodoni Moda',Georgia,serif;font-size:46px;letter-spacing:3px}.i2{font-style:italic;font-weight:400;letter-spacing:1px}</style><text class="c2" x="260" y="50" text-anchor="middle" fill="currentColor" font-weight="500"><tspan>Coll</tspan><tspan class="i2" dx="6">Takes</tspan><tspan dx="6">Chagrin</tspan><tspan fill="#C9A86A">.</tspan></text><rect x="190" y="64" width="140" height="1" fill="#C9A86A"/></svg><div class="note">header size</div></div></div>
</section>
<section class="light"><h2 style="color:#6b6559">A — on ivory</h2>
<svg viewBox="0 0 520 76" width="720"><style>.c3{font-family:'Bodoni Moda',Georgia,serif;font-size:46px;letter-spacing:3px}.i3{font-style:italic;font-weight:400;letter-spacing:1px}</style><text class="c3" x="260" y="50" text-anchor="middle" fill="#141210" font-weight="500"><tspan>Coll</tspan><tspan class="i3" dx="6">Takes</tspan><tspan dx="6">Chagrin</tspan><tspan fill="#C9A86A">.</tspan></text><rect x="190" y="64" width="140" height="1" fill="#C9A86A"/></svg>
</section>
<section><h2>B — alternate: tighter, italic "Takes", no rule</h2>
<div class="ctc alt">Coll<i>Takes</i>Chagrin<span class="dot">.</span></div>
</section>
<section><h2>C — alternate: small caps, wide tracking</h2>
<div class="cap">Coll Takes Chagrin</div>
</section>
<section><h2>D — alternate: stacked lockup for a profile tile or end card</h2>
<div class="ctc stack"><div class="big">Chagrin<span style="color:var(--brand-gold)">.</span></div><div class="small">Coll Takes</div></div>
</section>
</body></html>
